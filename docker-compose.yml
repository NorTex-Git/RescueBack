
services:
  # ==========================================
  # Backend Flask + MongoDB
  # ==========================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: rescue-backend:latest
    container_name: rescue-backend
    # Next corre con `pnpm dev` en el host. Publicar solo en loopback permite que
    # su BFF llegue al backend sin exponer la API a la red local.
    ports:
      - "${BACKEND_BIND_ADDRESS:-127.0.0.1}:${BACKEND_HOST_PORT:-5002}:5002"
    environment:
      - FLASK_ENV=production
      - FLASK_DEBUG=0
      - PYTHONUNBUFFERED=1
    env_file:
      - .env.production
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:5002/health', timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - global-network
      - rescue-network

  mongodb:
    image: mongo:7
    container_name: rescue-mongodb
    restart: unless-stopped
    expose:
      - "27017"
    volumes:
      - rescue-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - rescue-network

# ==========================================
# Usar la red externa provista por la infraestructura
# ==========================================
networks:
  global-network:
    external: true
  rescue-network:
    external: true

volumes:
  rescue-mongodb-data:
